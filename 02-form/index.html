<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="apply-box" id="box">
                <h1>JOB APPLICATION FORM 
                    <span class="small-title">(WEB)</span>
                </h1>
                <form action="">
                    <div class="form-container">
                        <div class="form-control">
                        <label for="First Name">First Name</label>
                        <input
                        id="First_name"
                        name="First_name"
                        placeholder="Enter First Name..."
                        />
                         <label for="last name"> Last Name</label>
                        <input
                        id="last_name"
                        name="last_name"
                        placeholder="Enter Last Name..."
                        />
                       
                        </div>
                        <div class="form-control">
                            <label for="email">Email</label>
                            <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter Emai..."
                            />
                        </div>
                        <div class="form-control">
                            <label for="job_role">Job Role</label>
                            <select id="job_role" name="job_role">
                                <option value="">Select Job Role...</option>
                                <option value="frontened">Frontened developer</option>
                                <option value="backened">Backened Developer</option> 
                                <option value="full_stack">Full Stack Developer</option>
                                <option value="ui/ux">UI/UX Designer</option>                         
                               </select>
                        </div>
                        <div class="textarea-control">
                            <label for="address">Address</label>
                            <textarea 
                            id="address" 
                            name="address" 
                            rows="=4" 
                            cols="50"
                            placeholder="Enter Address..."
                            ></textarea>
                        </div>
                        <div class="form-control">
                            <label for="city">City</label>
                            <input
                            id="city"
                            name="city"
                            placeholder="Enter City..."
                            />
                        </div>

                        <div class="form-control">
                            <label for="pincode">Pincode</label>
                            <input
                            type="number"
                            id="pincode"
                            name="pincode"
                            placeholder="Pincode..."
                            />
                        </div>
                        <div class="form-control">
                            <label for="date">Date</label>
                            <input
                            type="date"
                            value="2025-06-03"
                            id="name"
                            name="name"
                            />
                        </div>
                        <div class="form-control">
                            <label for="upload">Upload Your File</label>
                            <input
                            type="file"
                            id="upload"
                            name="upload"
                            />
                        </div>
                    </div>
                    <div class="button-container">
                        <button
                        type="submit">Apply Now</button>
                    </div>

                </form>
            </div>
                
            </div>
        </div>
           
    </body>
</html>
